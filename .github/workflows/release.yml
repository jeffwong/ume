# Two-stage release, the GitHub counterpart of scripts/release_check.sh and
# scripts/release_publish.sh.
#
# Stage 1 (automatic): verify, build wheels for every platform plus the sdist,
#   and test the built wheels. Artifacts are attached to the run for inspection.
# Stage 2 (gated): the `publish` job runs in the GitHub environment named by the
#   `repository` input. Give that environment required reviewers
#   (Settings → Environments → testpypi / pypi → Required reviewers), so the run
#   pauses after stage 1 until someone inspects the artifacts and approves.
#   A PyPI publish then tags v<version> and deploys the docs.
#
# One-time setup: on PyPI and TestPyPI, add a trusted publisher for this repo,
# workflow `release.yml`, environment `pypi` / `testpypi`. No API tokens needed.
name: Release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- stage 1
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the "tag does not exist yet" check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: uv sync --locked
      - id: meta
        run: |
          uv run python scripts/release_version.py check
          echo "version=$(uv run python scripts/release_version.py version)" >> "$GITHUB_OUTPUT"
      - run: make lint
      - run: make test
      - run: make docs

  wheels:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist  # abi3: one wheel for every Python >= 3.10
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Install each built wheel (not the source tree) and run the unit tests.
  test-wheels:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - shell: bash
        run: |
          python -m pip install numpy pytest hypothesis
          # --no-index: install ume only from dist/, never from PyPI.
          python -m pip install --no-index --find-links dist ume
          python -m pytest tests -q -p no:cacheprovider

  check-dist:
    needs: [verify, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v5
      - run: uvx twine check --strict dist/*
      - run: |
          {
            echo "## Release candidate ${{ needs.verify.outputs.version }} → ${{ inputs.repository }}"
            echo
            echo "Approve the \`publish\` job to upload these files:"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 2
  publish:
    needs: [verify, test-wheels, check-dist]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/ume' || 'https://test.pypi.org/p/ume' }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  tag:
    needs: [verify, publish]
    if: inputs.repository == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A source release may already be tagged at this commit (decision 0024).
          git fetch --tags
          v="v${{ needs.verify.outputs.version }}"
          if ! git rev-parse --verify --quiet "refs/tags/$v" >/dev/null; then
            git tag -a "$v" -m "ume ${{ needs.verify.outputs.version }}"
            git push origin "$v"
          fi

  docs:
    needs: tag
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
